services:
  db:
    image: postgres:16-alpine
    container_name: metering_billing_db
    environment:
      POSTGRES_DB: metering_billing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metering_billing"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: metering_billing_app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/metering_billing
      - STRIPE_API_KEY=sk_test_placeholder
      - STRIPE_WEBHOOK_SECRET=whsec_placeholder
      - STRIPE_PRO_PRICE_ID=price_pro_placeholder
      - PORT=8000
      - HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
